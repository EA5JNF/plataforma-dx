# Sube las zonas VOACAP (formato 3) a Cloudflare Pages.
# Las zonas se cogen de la rama «voacap-datos», que no forma parte de la web de GitHub Pages.
# Se ejecuta a mano: pestaña Actions > «Zonas VOACAP a Cloudflare» > Run workflow.
# Necesita dos secretos del repositorio: CLOUDFLARE_API_TOKEN (permiso solo para Pages) y CLOUDFLARE_ACCOUNT_ID.
name: Zonas VOACAP a Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voacap-cloudflare
  cancel-in-progress: false
jobs:
  subir:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Coger las zonas de la rama de datos
        uses: actions/checkout@v4
        with:
          ref: voacap-datos
          path: site
      - name: Preparar la carpeta
        run: |
          rm -rf site/.git site/README.md
          printf '/hubs/*\n  Access-Control-Allow-Origin: *\n  Cache-Control: public, max-age=31536000, immutable\n' > site/_headers
          echo "Archivos: $(find site -type f | wc -l)"; du -sh site
      - name: Crear el proyecto si no existe y subir las zonas
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.100.0 pages project create acracb-voacap --production-branch=main || true
          npx --yes wrangler@4.100.0 pages deploy site --project-name=acracb-voacap --branch=main --commit-dirty=true
