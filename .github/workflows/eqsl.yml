# Copia semanal de la lista pública de socios «Authenticity Guaranteed» de eQSL.cc en datos/eqsl/.
# Es un fichero público y gratuito, sin registro. Se usa la versión con fecha (AGMemberListDated.txt: indicativo
# y fecha de su última subida) y se guardan los que han subido su log en el último año. Si esa versión no
# responde, se usa la lista sin fechas (AGMemberList.txt). Mismo reparto en 64 trozos que datos/lotw/ y web/lotw.js.
name: Usuarios de eQSL
on:
  schedule:
    - cron: "41 4 * * 2"   # martes a las 04:41 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [".github/workflows/eqsl.yml"]
permissions:
  contents: write
concurrency: eqsl
jobs:
  eqsl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: datos
          fetch-depth: 1
      - name: Descargar la lista de eQSL
        run: |
          UA="ACRACB-PlataformaDX (+https://ea5jnf.github.io/plataforma-dx/)"
          if curl -fsSL --max-time 180 -A "$UA" "https://www.eqsl.cc/qslcard/DownloadedFiles/AGMemberListDated.txt" -o u.txt && [ "$(wc -l < u.txt)" -gt 20000 ]; then
            echo dated > tipo
          else
            curl -fsSL --max-time 180 -A "$UA" "https://www.eqsl.cc/qslcard/DownloadedFiles/AGMemberList.txt" -o u.txt
            echo plain > tipo
          fi
          echo "Tipo: $(cat tipo) · líneas: $(wc -l < u.txt)"; head -5 u.txt
      - name: Repartir en 64 trozos
        run: |
          python3 - <<'PY'
          import datetime, os, re, shutil
          tipo = open("tipo").read().strip()
          hoy = datetime.date.today(); corte = hoy - datetime.timedelta(days=365)
          ok = re.compile(r"^[A-Z0-9/]{3,15}$")
          trozos = [[] for _ in range(64)]; n = 0
          for l in open("u.txt", encoding="utf-8", errors="ignore"):
              l = l.strip()
              if not l or l.startswith("#") or "list" in l.lower():
                  continue
              partes = [x.strip() for x in l.split(",")]
              c = partes[0].upper()
              if not ok.match(c) or not any(ch.isdigit() for ch in c) or not any(ch.isalpha() for ch in c):
                  continue
              v = "AG"
              if tipo == "dated":
                  if len(partes) < 2:
                      continue
                  try:
                      d = datetime.date.fromisoformat(partes[1][:10])
                  except ValueError:
                      continue
                  if d < corte:
                      continue
                  v = d.strftime("%y%m%d")
              h = 0
              for ch in c:
                  h = (h * 31 + ord(ch)) % 64
              trozos[h].append(f"{c} {v}"); n += 1
          if n < 20000:
              raise SystemExit(f"Solo {n} indicativos: no se cambia nada")
          shutil.rmtree("datos/eqsl", ignore_errors=True); os.makedirs("datos/eqsl")
          for i, t in enumerate(trozos):
              open(f"datos/eqsl/{i:02d}.txt", "w").write("\n".join(sorted(set(t))) + "\n")
          fuente = "AGMemberListDated.txt (con fecha de última subida; solo subidas del último año)" if tipo == "dated" else "AGMemberList.txt (sin fechas)"
          open("datos/eqsl/LEEME.txt", "w").write(f"Socios AG de eQSL.cc: {n}. Copia del {hoy.isoformat()}.\n"
                                                 f"Fuente: https://www.eqsl.cc/qslcard/DownloadedFiles/{fuente} (pública y gratuita).\n")
          print("Indicativos:", n, "· tipo:", tipo)
          PY
          rm -f u.txt tipo
      - name: Guardar si ha cambiado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A datos/eqsl
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -qm "Usuarios de eQSL al día"
          git pull -q --rebase && git push -q
